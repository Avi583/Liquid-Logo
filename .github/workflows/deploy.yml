# Builds the Blazor WebAssembly app and pushes the static output to the gh-pages branch.
# GitHub Pages is set to "Deploy from a branch: gh-pages / (root)".
name: Build and push to gh-pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "gh-pages"
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download GitHub mark
        run: |
          mkdir -p wwwroot/images
          curl -fsSL https://raw.githubusercontent.com/primer/octicons/main/icons/mark-github-24.svg -o wwwroot/images/github-mark.svg

      - name: Publish
        run: dotnet publish Avi583Logo.csproj -c Release -o publish

      - name: Prepare site for GitHub Pages
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          sed -i "s|<base href=\"/\" />|<base href=\"$BASE\" />|" publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: publish/wwwroot
          force_orphan: true
